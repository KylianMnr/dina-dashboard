function stats(){
 const w=Date.now()-7*864e5,tk=S.tasks;const rec=tk.filter(t=>new Date(t.finished_at||t.created_at)>w);
 const dec=S.approvals.filter(a=>['approved','edited','rejected'].includes(a.status)&&a.kind!=='prompt_change'&&a.decided_at&&new Date(a.decided_at)>w);
 const acc=dec.length?Math.round(dec.filter(a=>a.status!=='rejected').length/dec.length*100):null;
 const by={};Object.keys(AG).forEach(a=>by[a]={done:0,fail:0,wait:0,cost:0,ok:0,dec:0});
 rec.forEach(t=>{const b=by[t.agent];if(!b)return;if(t.status==='failed')b.fail++;else if(t.status==='waiting_approval')b.wait++;else if(t.status==='done')b.done++});
 (S.runs||[]).filter(r=>new Date(r.created_at)>w).forEach(r=>{const b=by[r.agent];if(b)b.cost+=Number(r.cost_usd)});
 dec.forEach(a=>{const b=by[a.agent];if(b){b.dec++;if(a.status!=='rejected')b.ok++}});
 return{running:tk.filter(t=>t.status==='running').length,waiting:S.approvals.filter(a=>a.status==='pending').length,failed:rec.filter(t=>t.status==='failed').length,done:rec.filter(t=>t.status==='done').length,acc,by}}

<script type="text/plain" id="gs">
/**
 * DINA · Synchronisation du Drive vers les agents
 * Parcourt le dossier DINA CRÉATION (et tous ses sous-dossiers), lit le texte des documents
 * et l'envoie au serveur DINA. Les agents y ont ensuite accès automatiquement.
 *
 * Installation (une seule fois) :
 * 1. Collez votre clé « Robot Drive » (Hub DINA > Accès) entre les guillemets de CLE ci-dessous.
 * 2. Enregistrez, choisissez la fonction « installer » puis cliquez sur Exécuter et autorisez l'accès.
 * Ensuite tout est automatique : une vérification toutes les 10 minutes.
 */
const CLE = 'COLLEZ_ICI_LA_CLE_ROBOT_DRIVE';
const SERVEUR = 'https://osfxqudjkforfzfsdrub.supabase.co/functions/v1/agents/drive_ingest';
// Dossiers synchronisés (id visible dans l'adresse du dossier). Par défaut : DINA CRÉATION.
const DOSSIERS = ['1dIxdjpFldSSOzWWUE3xiYIynJ5iE7r1O'];

const MAX_TEXTE = 150000;      // caractères gardés par document
const MAX_LOT = 1500000;       // taille maximale d'un envoi
const DUREE_MAX = 4.5 * 60000; // Google coupe un script à 6 minutes

function installer() {
  ScriptApp.getProjectTriggers().forEach(function (t) { if (t.getHandlerFunction() === 'synchroniser') ScriptApp.deleteTrigger(t); });
  ScriptApp.newTrigger('synchroniser').timeBased().everyMinutes(10).create();
  synchroniser();
}

function synchroniser() {
  if (!CLE || CLE.indexOf('COLLEZ_ICI') === 0) throw new Error('Collez la clé Robot Drive dans la constante CLE.');
  const verrou = LockService.getScriptLock();
  if (!verrou.tryLock(1000)) return; // une synchronisation tourne déjà
  try {
    const debut = Date.now();
    const connus = {};
    envoyer_({ action: 'state' }).docs.forEach(function (d) { connus[d[0]] = { modifie: d[1] ? Date.parse(d[1]) : 0, chemin: d[2] || '' }; });

    const vus = {}, aTraiter = [];
    DOSSIERS.forEach(function (id) { const f = DriveApp.getFolderById(id); parcourir_(f, f.getName(), vus, aTraiter, connus); });
    const supprimes = Object.keys(connus).filter(function (id) { return !vus[id]; });

    let lot = [], taille = 0, restants = aTraiter.length, premier = true;
    const pousser = function (fin) {
      if (!lot.length && !(premier && supprimes.length) && !fin) return;
      envoyer_({ files: lot, removed: premier ? supprimes : [], done: fin && restants === 0, pending: restants });
      premier = false; lot = []; taille = 0;
    };
    for (let i = 0; i < aTraiter.length; i++) {
      if (Date.now() - debut > DUREE_MAX) break;
      const e = aTraiter[i];
      const txt = texte_(e.fichier).slice(0, MAX_TEXTE);
      lot.push({ id: e.id, name: e.fichier.getName(), path: e.chemin, mime: e.fichier.getMimeType(), url: e.fichier.getUrl(), size: e.fichier.getSize(), modified: e.fichier.getLastUpdated().toISOString(), content: txt });
      taille += txt.length + 500;
      restants--;
      if (taille > MAX_LOT || lot.length >= 15) pousser(false);
    }
    pousser(true);
  } finally {
    verrou.releaseLock();
  }
}

function parcourir_(dossier, chemin, vus, aTraiter, connus) {
  const fichiers = dossier.getFiles();
  while (fichiers.hasNext()) {
    const f = fichiers.next();
    if (f.isTrashed() || f.getMimeType() === 'application/vnd.google-apps.shortcut') continue;
    const id = f.getId();
    vus[id] = true;
    const k = connus[id];
    if (!k || k.chemin !== chemin || Math.abs(k.modifie - f.getLastUpdated().getTime()) > 1000) aTraiter.push({ id: id, fichier: f, chemin: chemin });
  }
  const sous = dossier.getFolders();
  while (sous.hasNext()) {
    const d = sous.next();
    if (!d.isTrashed()) parcourir_(d, chemin + '/' + d.getName(), vus, aTraiter, connus);
  }
}

const CONVERSION = {
  'application/pdf': MimeType.GOOGLE_DOCS,
  'application/vnd.openxmlformats-officedocument.wordprocessingml.document': MimeType.GOOGLE_DOCS,
  'application/msword': MimeType.GOOGLE_DOCS,
  'application/vnd.oasis.opendocument.text': MimeType.GOOGLE_DOCS,
  'application/rtf': MimeType.GOOGLE_DOCS,
  'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet': MimeType.GOOGLE_SHEETS,
  'application/vnd.ms-excel': MimeType.GOOGLE_SHEETS,
  'application/vnd.oasis.opendocument.spreadsheet': MimeType.GOOGLE_SHEETS,
  'application/vnd.openxmlformats-officedocument.presentationml.presentation': MimeType.GOOGLE_SLIDES,
  'application/vnd.ms-powerpoint': MimeType.GOOGLE_SLIDES,
};

function texte_(f) {
  const mime = f.getMimeType(), id = f.getId();
  try {
    if (mime === MimeType.GOOGLE_DOCS) return DocumentApp.openById(id).getBody().getText();
    if (mime === MimeType.GOOGLE_SHEETS) return feuilles_(SpreadsheetApp.openById(id));
    if (mime === MimeType.GOOGLE_SLIDES) return diapos_(SlidesApp.openById(id));
    if (CONVERSION[mime]) return f.getSize() < 20 * 1024 * 1024 ? converti_(id, CONVERSION[mime]) : '';
    if (/^text\//.test(mime) || /^application\/(json|csv|xml|markdown|x-markdown)$/.test(mime)) return f.getBlob().getDataAsString();
  } catch (e) {
    console.warn('Lecture impossible : ' + f.getName() + ' : ' + e.message);
  }
  return ''; // images, vidéos, etc. : seules les informations du fichier sont envoyées
}

// Copie temporaire convertie au format Google (texte des PDF compris), lue puis mise à la corbeille.
function converti_(id, cible) {
  const jeton = ScriptApp.getOAuthToken();
  const r = UrlFetchApp.fetch('https://www.googleapis.com/drive/v3/files/' + id + '/copy?ocrLanguage=fr&fields=id', {
    method: 'post', contentType: 'application/json', muteHttpExceptions: true,
    headers: { Authorization: 'Bearer ' + jeton },
    payload: JSON.stringify({ mimeType: cible, name: 'tmp-index-dina', parents: ['root'] }),
  });
  if (r.getResponseCode() !== 200) { console.warn('Conversion refusée (' + r.getResponseCode() + ')'); return ''; }
  const copie = JSON.parse(r.getContentText()).id;
  try {
    if (cible === MimeType.GOOGLE_DOCS) return DocumentApp.openById(copie).getBody().getText();
    if (cible === MimeType.GOOGLE_SHEETS) return feuilles_(SpreadsheetApp.openById(copie));
    return diapos_(SlidesApp.openById(copie));
  } finally {
    DriveApp.getFileById(copie).setTrashed(true);
  }
}

function feuilles_(classeur) {
  let t = '';
  classeur.getSheets().slice(0, 10).forEach(function (s) {
    const v = s.getDataRange().getDisplayValues().slice(0, 1000);
    t += '## ' + s.getName() + '\n' + v.map(function (l) { return l.join(' | '); }).join('\n') + '\n\n';
  });
  return t;
}

function diapos_(pres) {
  let t = '';
  pres.getSlides().forEach(function (s, i) {
    t += '## Diapositive ' + (i + 1) + '\n';
    s.getShapes().forEach(function (sh) { try { t += sh.getText().asString() + '\n'; } catch (e) { /* forme sans texte */ } });
  });
  return t;
}

function envoyer_(donnees) {
  const r = UrlFetchApp.fetch(SERVEUR, {
    method: 'post', contentType: 'application/json', muteHttpExceptions: true,
    headers: { 'x-agents-key': CLE },
    payload: JSON.stringify(donnees),
  });
  if (r.getResponseCode() !== 200) throw new Error('Serveur DINA ' + r.getResponseCode() + ' : ' + r.getContentText().slice(0, 300));
  return JSON.parse(r.getContentText());
}</script></body></html>
